<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Generative Sequencer — Modal String</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header>
    <div class="title">
      <h1>Generative Sequencer <span class="sub">modal string</span></h1>
      <p class="status" id="status">audio not started</p>
    </div>
    <!-- Read-only: patches ship with the instrument, nothing is saved locally.
         See src/core/presets.js. -->
    <div class="patch">
      <label class="patch__label" for="preset-slots">Patch</label>
      <select id="preset-slots" aria-label="Factory patches"></select>
      <button id="preset-load">Load</button>
      <span class="patch__status" id="preset-status" aria-live="polite"></span>
    </div>

    <div class="transport">
      <button id="play" class="primary">Play</button>
      <button id="pluck">Pluck once</button>
      <button id="reseed">Reseed</button>
    </div>
  </header>

  <main>
    <aside class="rhythm-col">
      <div class="ring-wrap">
        <canvas id="ring" aria-label="Euclidean step ring"></canvas>
        <!-- Sized in JS to the inscribed square of the ring's hub. -->
        <div class="hub" id="hub"></div>
      </div>
      <div class="legend">
        <span><i class="swatch pulse"></i> Euclid pulse</span>
        <span><i class="swatch rest"></i> No pulse</span>
        <!-- Shown only while the rhythm loop is active -- see main.js's
             trigLoop handling and EuclidView.setLoopActive. -->
        <span id="legend-random" hidden><i class="swatch random"></i> Random pulse</span>
        <span><i class="swatch fired"></i> Triggered</span>
      </div>
      <div id="rhythm-controls"></div>
      <!-- Hidden for now. main.js only feeds it while it is visible, so removing
           this attribute is all it takes to bring it back. -->
      <div class="monitor" id="monitor" hidden>
        <pre id="readout" aria-live="off"></pre>
      </div>
    </aside>
    <div class="panel" id="controls"></div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
