<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Generative Sequencer — Modal String</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header>
    <div class="title">
      <h1>Generative Sequencer <span class="sub">modal string</span></h1>
      <p class="status" id="status">audio not started</p>
    </div>
    <!-- Read-only at runtime: patches ship with the instrument, nothing is saved
         locally. Export downloads a file for a developer to paste into
         presets/factory.json by hand -- see src/core/presets.js. -->
    <div class="patch">
      <label class="patch__label" for="preset-slots">Patch</label>
      <select id="preset-slots" aria-label="Factory patches" data-info="presetSlots"></select>
      <button id="preset-load" data-info="presetLoad">Load</button>
      <button id="preset-export" data-info="presetExport">Export</button>
      <span class="patch__status" id="preset-status" aria-live="polite"></span>
    </div>

    <!-- data-info names this control's entry in src/ui/infoText.js, which the footer
         bar shows on hover. Written by hand here because none of the header chrome
         has a param schema entry to take a key from; every control that does gets
         the attribute from its own spec, in its widget's constructor. -->
    <div class="transport">
      <!-- Tempo and master level, the instrument's only two global params, as
           drag-numbers filled by UIController.renderDragNumbers. They belong up here
           rather than in a track's control panel: every track runs off this clock
           and sums into this fader. -->
      <div class="transport__nums" id="transport-nums"></div>
      <button id="play" class="primary" data-info="play">Play</button>
      <button id="pluck" data-info="pluck">Pluck once</button>
      <button id="reseed" data-info="reseed">Reseed</button>
    </div>
  </header>

  <!-- The four track pages. Filled by src/ui/TrackTabs.js, and full-width because it
       switches both columns below, not just the ring. -->
  <div class="tabs-row" id="tabs-row"></div>

  <main>
    <aside class="rhythm-col">
      <div class="ring-wrap">
        <canvas id="ring" aria-label="Euclidean step ring" data-info="ring"></canvas>
        <!-- Sized in JS to the inscribed square of the ring's hub. -->
        <div class="hub" id="hub"></div>
      </div>
      <div class="legend">
        <span><i class="swatch pulse"></i> Euclid pulse</span>
        <span><i class="swatch rest"></i> No pulse</span>
        <!-- Shown only while the rhythm loop is active -- see main.js's
             trigLoop handling and EuclidView.setLoopActive. -->
        <span id="legend-random" hidden><i class="swatch random"></i> Random pulse</span>
        <span><i class="swatch fired"></i> Triggered</span>
      </div>
      <div id="rhythm-controls"></div>
      <!-- Hidden for now. main.js only feeds it while it is visible, so removing
           this attribute is all it takes to bring it back. -->
      <div class="monitor" id="monitor" hidden>
        <pre id="readout" aria-live="off"></pre>
      </div>
    </aside>
    <div class="panel" id="controls"></div>
  </main>

  <!-- Filled by src/ui/InfoBar.js, which builds the clipping lane and text span
       inside. aria-live="off" on purpose, as on #readout: this text changes on
       every hover, and each control already carries its own aria-label. -->
  <footer class="infobar" id="infobar" aria-live="off"></footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
