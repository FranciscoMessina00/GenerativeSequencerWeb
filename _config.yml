# GitHub Pages configuration.
#
# There is no build step: Pages serves this repo directly and Jekyll only copies
# files through, because none of them carry YAML front matter (a file without front
# matter is a static file and is never run through the template engine). This file
# exists solely for `exclude`.
#
# That distinction is load-bearing, not incidental. Several source files contain
# `{{` inside JSDoc type annotations -- e.g.
#     @typedef {{ name: string, patch: object }} FactoryPreset
# which Liquid would read as an expression and silently render as nothing, quietly
# corrupting the file. It cannot happen while those files stay static, so: never add
# YAML front matter to anything under src/, and if that ever becomes necessary,
# publish via a GitHub Actions workflow instead of Jekyll.
#
# NOTE: adding `exclude` REPLACES Jekyll's default exclude list, so the usual
# suspects are repeated below rather than inherited.
#
# NOTE: this keeps files off the *published site* -- so nobody can browse to
# <site>/test/browser/selftest.html. It does not make them private. In a public
# repo they are still readable on GitHub, which is the right place for them.
#
# Do NOT add a .nojekyll file: that disables Jekyll entirely and this exclude list
# along with it, putting everything back on the site.

exclude:
  # Test suites and the DSP harness -- no reason to be reachable, and the browser
  # harness is deliberately marked unreliable, so stumbling on it reads badly.
  - test/
  # Type declarations and editor/tooling config: build-time only.
  - types/
  - jsconfig.json
  - package.json
  - package-lock.json
  # Jekyll's own defaults, restored.
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock

# Nothing here needs Sass, plugins, or a collection; the site is index.html plus
# src/, styles/ and presets/.
